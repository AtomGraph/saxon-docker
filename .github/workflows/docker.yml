name: Docker

# The image of a Saxon-HE version, for amd64 and arm64: pushed as that version (e.g. 12.9), its major version and latest
# when a release tag (saxon-<version>) is pushed, or by hand for a tag given. The version is Saxon's, passed to the build.
# Needs the repository variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN, as CSV2RDF's and JSON2RDF's releases.
on:
  push:
    tags: ['saxon-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'the release tag to build (saxon-<version>)'
        required: true

env:
  IMAGE: atomgraph/saxon

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: The release's version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#saxon-}"
          major="${version%%.*}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SAXON_VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.major }}
            ${{ env.IMAGE }}:latest
